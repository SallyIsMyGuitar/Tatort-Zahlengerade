<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatort Zahlengerade – Der Fall √2</title>
<style>
  /* =========================================================
     OPTIK „Krimi-Akte“
     Schreibtisch (dunkel) · Aktendeckel (Manila) · Papier (Creme)
     Kontraste: Tinte #2b2419 auf Papier #f4ecd9 ≈ 13:1
     ========================================================= */
  :root {
    --desk: #1c1814;
    --desk-2: #2a231c;
    --manila: #d9bd84;
    --manila-dark: #b8975a;
    --paper: #f4ecd9;
    --paper-2: #ebe0c6;
    --paper-line: #c9d6e3;
    --ink: #2b2419;
    --ink-soft: #5a4d3b;
    --ink-blue: #1f3a5f;
    --stamp-red: #a8322a;
    --ok: #1f6b33;
    --err: #a8322a;
    --info: #1f3a5f;
    --marker: #ffd046;
    --line: #6f5f45;
    --type: "American Typewriter", "Courier New", Courier, monospace;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--desk);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255, 214, 140, .10), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 9px);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px; line-height: 1.45;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  }
  button, input, select { font: inherit; }
  .hidden { display: none !important; }

  /* ---------- Startscreen: Aktendeckel ---------- */
  #screen-start {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem 1rem;
  }
  .folder { width: min(940px, 100%); position: relative; }
  .folder-tab {
    display: inline-block; background: var(--manila);
    padding: .45rem 1.4rem .3rem; border-radius: 12px 12px 0 0;
    font-family: var(--type); font-weight: 700; letter-spacing: .08em; color: var(--ink);
  }
  .folder-body {
    background: var(--manila);
    background-image: linear-gradient(160deg, rgba(255,255,255,.18), rgba(0,0,0,.06));
    border-radius: 0 14px 14px 14px; padding: 1.4rem;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
    display: grid; grid-template-columns: 260px 1fr; gap: 1.4rem; position: relative;
  }
  .poster {
    background: var(--paper); border-radius: 4px; padding: .8rem;
    box-shadow: 2px 3px 0 rgba(0,0,0,.18); transform: rotate(-2.5deg);
    align-self: start; text-align: center; position: relative;
  }
  .poster::before {
    content: ""; position: absolute; top: -10px; left: 50%; width: 46px; height: 18px;
    margin-left: -23px; background: rgba(255, 240, 180, .75); transform: rotate(4deg);
  }
  .poster .poster-head { font-family: var(--type); font-weight: 700; font-size: 1.6rem; letter-spacing: .15em; color: var(--stamp-red); }
  .poster .poster-sub { font-size: .9rem; color: var(--ink-soft); }
  .poster svg { width: 100%; height: auto; display: block; }
  .folder-main { min-width: 0; }
  .folder-main h1 {
    font-family: var(--type); font-size: 2.1rem; margin: .1rem 0 0; color: var(--ink); line-height: 1.15;
  }
  .folder-main .subtitle { font-family: var(--type); font-size: 1.3rem; color: var(--stamp-red); margin: .1rem 0 .8rem; }
  .intro {
    background: var(--paper); border-radius: 4px; padding: .9rem 1.1rem;
    box-shadow: 2px 3px 0 rgba(0,0,0,.15); color: var(--ink);
  }
  .intro p { margin: .45rem 0; }
  .start-actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
  #continue-hint { color: var(--ink); margin: .6rem 0 0; font-size: .95rem; }

  /* ---------- Stempel ---------- */
  .stamp {
    position: absolute; font-family: var(--type); font-weight: 700; letter-spacing: .12em;
    border: 3px solid currentColor; border-radius: 6px; padding: .15rem .6rem;
    transform: rotate(-8deg); opacity: .85; pointer-events: none; text-transform: uppercase;
  }
  .stamp-red { color: var(--stamp-red); }
  .stamp-ok { color: var(--ok); }
  .folder-body > .stamp { top: 1rem; right: 1.2rem; font-size: 1.1rem; }
  .stamp-anim { animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes stampIn {
    from { transform: rotate(-8deg) scale(2.2); opacity: 0; }
    to   { transform: rotate(-8deg) scale(1); opacity: .9; }
  }

  /* ---------- Buttons ---------- */
  .btn {
    min-height: 48px; min-width: 48px;
    padding: 12px 20px; border: none; border-radius: 8px;
    background: var(--ink-blue); color: #fff; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--stamp-red); outline-offset: 2px; }
  .btn-secondary { background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn-small { padding: 8px 14px; min-height: 44px; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- Spielbildschirm ---------- */
  #screen-game { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100vh; height: 100dvh; }
  #topbar {
    display: flex; gap: .45rem; align-items: center;
    padding: .45rem .75rem; background: var(--desk-2);
    border-bottom: 3px solid var(--manila-dark); flex-wrap: wrap;
  }
  #topbar .location {
    font-family: var(--type); font-weight: 700; margin-right: auto; color: var(--manila);
    letter-spacing: .03em;
  }
  #topbar .location::before { content: "AKTE √2 · "; color: #a8987a; font-weight: 400; }
  #topbar .btn-secondary {
    background: var(--manila); color: var(--ink); border: none;
    border-radius: 8px 8px 3px 3px; font-family: var(--type);
  }
  #stage { flex: 1; min-height: 0; display: flex; background: #0f0d0b; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #msgbar {
    padding: .55rem 1rem .55rem 3rem; min-height: 3.2rem;
    background: var(--paper); color: var(--ink);
    border-top: 3px solid var(--manila-dark);
    background-image: linear-gradient(90deg, rgba(168,50,42,.35) 0 2px, transparent 2px);
    background-size: 100% 100%; background-position: 2.2rem 0; background-repeat: no-repeat;
  }
  #msgbar b { color: var(--ink); }
  #msgbar .speaker { font-family: var(--type); font-weight: 700; color: var(--stamp-red); }

  /* Hotspots: Beweismarker */
  .hotspot { cursor: pointer; }
  .hotspot .hit { fill: transparent; stroke: none; }
  .hotspot:active .hit { fill: rgba(255, 208, 70, .12); }
  .hotspot:focus-visible { outline: none; }
  .hotspot:focus-visible .hit { stroke: var(--marker); stroke-width: 4; stroke-dasharray: 10 6; }
  .hotspot .marker { fill: var(--marker); stroke: #1c1814; stroke-width: 2.5; }
  .hotspot .marker-ring { fill: none; stroke: rgba(255, 208, 70, .55); stroke-width: 3; }
  .hotspot .marker-text { font: bold 19px sans-serif; fill: #1c1814; text-anchor: middle; pointer-events: none; }
  .hotspot.solved .marker { fill: #7fd08c; }
  .hotspot.solved .marker-ring { stroke: rgba(127, 208, 140, .5); }
  @media (prefers-reduced-motion: no-preference) {
    .hotspot:not(.solved) .marker-ring { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.25); opacity: .2; } }
  }

  /* ---------- Dialoge: Aktenblatt ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(12, 10, 8, .72);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 40;
  }
  .modal {
    position: relative;
    background: var(--paper); color: var(--ink);
    border-radius: 4px; padding: 1.2rem 1.3rem 1.1rem;
    width: min(600px, 100%); max-height: 88vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 3px 4px 0 var(--paper-2);
    border-top: 10px solid var(--manila);
  }
  .modal .kicker { font-family: var(--type); font-size: .85rem; letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; }
  .modal h2 { font-family: var(--type); margin: .15rem 0 .5rem; font-size: 1.3rem; padding-right: 5.5rem; }
  .modal h3 { font-family: var(--type); font-size: 1.05rem; margin: 1rem 0 .4rem; border-bottom: 2px solid var(--manila); padding-bottom: .15rem; }
  .modal .desc { color: var(--ink-soft); margin: 0 0 .8rem; }
  .modal .prompt {
    margin: 0 0 .7rem; background: #fffaf0; border: 1px dashed var(--line);
    border-radius: 4px; padding: .6rem .75rem; font-size: 1.08rem;
  }
  .modal .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
  .modal .stamp { top: 1.3rem; right: 1rem; font-size: .95rem; }
  .answer-input {
    width: 100%; min-height: 50px; font-size: 1.15rem;
    background: #fffdf7; color: var(--ink);
    border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px;
  }
  .answer-input:focus { outline: none; border-color: var(--ink-blue); box-shadow: 0 0 0 3px rgba(31,58,95,.2); }
  #feedback { margin-top: .7rem; min-height: 1.4rem; font-weight: 600; }
  #feedback.ok { color: var(--ok); }
  #feedback.err { color: var(--err); }
  #feedback.info { color: var(--info); }
  #feedback.err::before { content: "✗ "; }
  #feedback.ok::before { content: "✓ "; }

  /* Hilfen als Haftnotizen */
  .helpbox {
    margin-top: .6rem; background: #fff3a8; color: var(--ink);
    border-radius: 2px; padding: .6rem .8rem; box-shadow: 2px 3px 0 rgba(0,0,0,.12);
  }
  .helpbox:nth-child(2) { transform: rotate(.4deg); }
  .helpbox.merk { background: #d9ecff; }
  .helpbox.beispiel { background: #dcf3d6; }
  .helpbox .helplabel { font-family: var(--type); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); display: block; margin-bottom: .2rem; }

  /* Auswahlmöglichkeiten */
  .choices { display: grid; gap: .5rem; }
  .choices .choice {
    min-height: 48px; text-align: left; color: var(--ink);
    background: #fffdf7; border: 2px solid var(--paper-2);
    border-radius: 6px; padding: 10px 12px; cursor: pointer;
    display: flex; align-items: center;
  }
  .choices .choice:active { border-color: var(--ink-blue); }
  .choices .choice:focus-visible { outline: 3px solid var(--ink-blue); }

  /* Schnellwahl und Symbolleiste (iPad-Tastatur hat kein √) */
  .quick { display: flex; gap: .5rem; flex-wrap: wrap; }
  .quick .btn { min-width: 76px; font-size: 1.2rem; }
  .symbar { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
  .symbar .sym {
    min-width: 48px; min-height: 44px; padding: 6px 10px; color: var(--ink);
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px;
    font-size: 1.15rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
  }
  .symbar .sym:active { background: var(--manila); }
  .symbar .sym:focus-visible { outline: 3px solid var(--ink-blue); }
  .symbar .sym-del { margin-left: auto; }

  .niveau-bar { display: flex; gap: .5rem; flex-wrap: wrap; }
  .niveau-bar .btn { min-width: 120px; }

  /* Listen (Notizbuch, Inventar, Räume) als Karteikarten */
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li {
    background: #fffdf7; border: 1px solid var(--paper-2); border-left: 4px solid var(--manila-dark);
    border-radius: 3px; padding: .5rem .7rem; margin-bottom: .4rem;
  }
  ul.plain li .n-title { font-weight: 700; }
  ul.plain li .n-text { color: var(--ink-soft); font-size: .95rem; }
  .tag {
    display: inline-block; vertical-align: middle; font-family: var(--type); font-size: .75rem; font-weight: 700;
    color: var(--stamp-red); border: 2px solid currentColor; border-radius: 4px;
    padding: 0 .4rem; margin-left: .5rem; letter-spacing: .06em; text-transform: uppercase;
  }

  /* Notizbuch: liniertes Papier */
  .modal.notebook {
    border-top: none; border-left: 26px solid #3d5a80;
    background-image: repeating-linear-gradient(transparent 0 27px, var(--paper-line) 27px 28px);
    background-color: #fbf8f0;
  }
  .modal.notebook ul.plain li { background: rgba(255,255,255,.75); }

  /* Abschlussbericht */
  .modal.report { width: min(680px, 100%); }
  .modal.report .stamp { font-size: 1.1rem; top: 1.4rem; }
  #end-list li.done { border-left-color: var(--ok); }
  #end-list li.done .n-title::after { content: " ✓"; color: var(--ok); }
  .end-figure { float: right; width: 110px; margin: 0 0 .5rem .8rem; }

  #dev-panel {
    position: fixed; left: 8px; bottom: 8px; z-index: 90;
    background: #10141c; border: 1px solid #46506a; border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    padding: .5rem .7rem; max-width: 340px; max-height: 55vh; overflow-y: auto;
    color: #c8d0dd; white-space: pre-wrap;
  }
  #dev-panel .t-ok { color: #63d471; }
  #dev-panel .t-err { color: #ff7b72; }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .folder-body { grid-template-columns: 1fr; }
    .poster { max-width: 220px; justify-self: center; }
    .folder-main h1 { font-size: 1.6rem; }
    #topbar .location::before { content: ""; }
  }
</style>
</head>
<body>

<section id="screen-start">
  <div class="folder">
    <div class="folder-tab">AKTE Nr. √2</div>
    <div class="folder-body">
      <div class="stamp stamp-red">Vertraulich</div>
      <div class="poster" aria-hidden="true">
        <div class="poster-head">VERMISST</div>
        <svg viewBox="0 0 200 170" id="poster-sqrt2"></svg>
        <div class="poster-sub">Zuletzt gesehen zwischen 1 und 2.<br>Hinweise an das Detektivteam.</div>
      </div>
      <div class="folder-main">
        <h1>Tatort Zahlengerade</h1>
        <p class="subtitle">Der Fall √2</p>
        <div class="intro" id="intro-text"></div>
        <div class="start-actions">
          <button class="btn hidden" id="btn-continue" type="button">Ermittlung fortsetzen</button>
          <button class="btn" id="btn-start" type="button">Neue Ermittlung starten</button>
        </div>
        <p id="continue-hint" class="hidden"></p>
      </div>
    </div>
  </div>
</section>

<section id="screen-game" class="hidden">
  <div id="topbar">
    <span class="location" id="location-label"></span>
    <button class="btn btn-secondary btn-small" id="btn-notes" type="button">Notizbuch</button>
    <button class="btn btn-secondary btn-small" id="btn-inventory" type="button">Inventar</button>
    <button class="btn btn-secondary btn-small" id="btn-map" type="button">Räume</button>
    <button class="btn btn-secondary btn-small" id="btn-restart" type="button">Neu starten</button>
  </div>
  <div id="stage"></div>
  <div id="msgbar" aria-live="polite"></div>
</section>

<div id="overlay" class="hidden" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<div id="dev-panel" class="hidden"></div>

<script>
"use strict";

/* =========================================================
   TATORT ZAHLENGERADE – Der Fall √2
   Struktur:
     1. DATA   – alle Inhalte (Story, Räume, Hotspots, Rätsel,
                 Hilfen, Lösungen, typische Fehler). Nur Daten.
     2. ENGINE – Rendering, Zustand, Speicherung, Auswertung.
     3. DEV    – Testfunktion, nur mit ?dev=1 aktiv.
   ========================================================= */

/* ---------------------------------------------------------
   1. DATEN
   --------------------------------------------------------- */
const DATA = { story: {}, rooms: {}, puzzles: {}, errors: {}, items: {}, notes: {} };

/* ---------- Story und Rahmen ---------- */
DATA.story = {
  title: "Tatort Zahlengerade – Der Fall √2",
  intro: [
    "<p><b>Auftrag für das Detektivteam!</b></p>",
    "<p>In der Zahlensammlung des Direktors fehlt eine Zahl: <b>√2</b>. Zurück bleiben nur ein leerer Rahmen und ein Zettel mit der Aufschrift: „Bin kurz unerhörlich. Bin gleich wieder da. Versprochen. – √2“.</p>",
    "<p>Der Direktor tobt, der Hausmeister fegt wortlos Quadrate in den Staub, und in der Bibliothek behauptet jemand, √2 sei „nie wirklich rational“ gewesen. Ermittle an fünf Tatorten: im <b>Hausmeisterkeller</b>, in der <b>Bibliothek</b>, im <b>Labor</b>, im <b>Lehrerzimmer</b> und im <b>Direktorat</b>.</p>",
    "<p>Nimm Gegenstände auf, sammle Zahlen und Merkregeln im Notizbuch – und bring Licht in die halbdunkle Angelegenheit. Viel Erfolg, Ermittlerin oder Ermittler!</p>"
  ].join(""),
  requiredIds: ["keller_schloss", "bibliothek_kartei", "bibliothek_periode", "bibliothek_begruendung", "labor_eingrenzen", "labor_x2", "lehrer_produkt", "lehrer_radizieren", "lehrer_nenner", "direktor_code", "direktor_gleichung", "direktor_taeter"],
  roomOrder: ["keller", "bibliothek", "labor", "lehrerzimmer", "direktorat"],
  /* Freischaltung der Räume: Rätsel-ID, die gelöst sein muss (null = offen). */
  roomUnlock: {
    keller: null,
    bibliothek: "keller_schloss",
    labor: "bibliothek_begruendung",
    lehrerzimmer: "labor_eingrenzen",
    direktorat: "lehrer_radizieren"
  }
};

/* ---------- Aufnehmbare Gegenstände ---------- */
DATA.items = {
  taschenlampe: {
    name: "Taschenlampe",
    desc: "Die Taschenlampe des Hausmeisters. Leuchtet ungewöhnlich quadratisch."
  }
};

/* ---------- Notizbuch: Merkregeln ---------- */
DATA.notes = {
  n_wurzel_def: {
    title: "Definition: Quadratwurzel",
    text: "Für a ≥ 0 ist √a die nichtnegative Zahl, deren Quadrat a ergibt. Beispiel: √16 = 4, denn 4² = 16."
  },
  n_abs: {
    title: "Merkregel: √(a²) = |a|",
    text: "Für alle a ∈ ℝ gilt √(a²) = |a|. Zum Beispiel √((−12)²) = |−12| = 12. Der Betrag sorgt dafür, dass die Wurzel nie negativ wird."
  },
  n_x2: {
    title: "Merkregel: x² = a",
    text: "Für a > 0 hat x² = a zwei Lösungen: L = {−√a; √a}. Beispiel: x² = 121 → L = {−11; 11}. Für a = 0 gilt L = {0}, für a < 0 gibt es keine Lösung."
  },
  n_mengen: {
    title: "Zahlenmengen",
    text: "ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Jede rationale Zahl lässt sich als Bruch p/q (q ≠ 0) schreiben; ihre Dezimalentwicklung bricht ab oder ist periodisch. Irrationale Zahlen wie √2 gehören zu ℝ, aber nicht zu ℚ."
  },
  n_rat: {
    title: "Merkregel: rational erkennen",
    text: "Eine Dezimalzahl ist rational, wenn sie abbricht oder periodisch ist. Beispiel: 0,66666… = 0,6̄ = 2/3, also rational. „Unendlich viele Nachkommastellen“ allein heißt nicht irrational!"
  },
  n_irr: {
    title: "Warum √2 irrational ist",
    text: "√2 liegt zwischen 1 und 2, ist aber kein Bruch: Es gibt keine rationale Zahl p/q mit (p/q)² = 2. Die Dezimalentwicklung von √2 bricht nie ab und wiederholt sich nie. Deshalb erweitert man die Zahlenmenge auf die reellen Zahlen ℝ."
  },
  n_fund_lampe: {
    title: "Fund in der dunklen Ecke",
    text: "Hinter dem Regal stand mit Kreide: „1 < √2 < 2 – hier verstecke ich mich gern.“ Ein erster Hinweis: √2 liegt zwischen zwei aufeinanderfolgenden ganzen Zahlen."
  },
  n_produkt: {
    title: "Merkregel: Produkt von Wurzeln",
    text: "√a · √b = √(a · b), z. B. √3 · √7 = √21. Wichtig: Die Wurzeln werden multipliziert, nicht addiert – √a · √b ist nie √(a + b)."
  },
  n_radizieren: {
    title: "Merkregel: Teilweises Radizieren",
    text: "√(a² · b) = a · √b. Größten quadratischen Faktor suchen und vor die Wurzel ziehen. Beispiel: √72 = √(36 · 2) = 6√2."
  },
  n_nenner: {
    title: "Merkregel: Nenner rational machen",
    text: "Bei a/√b mit √b erweitern: a/√b = (a · √b)/(√b · √b) = a√b/b. Beispiel: 5/√3 = 5√3/3."
  }
};

/* ---------- Texte zur Engine ---------- */
DATA.errors = {
  generic: "Das stimmt noch nicht. Schau noch einmal genau hin – oder hole dir einen Tipp.",
  notSimplified: "Der Wert stimmt – aber der Term ist noch nicht so weit wie möglich vereinfacht. Schau dir die Merkregel in der Hilfe an.",
  wrongBounds: "Prüfe durch Quadrieren: Die Zahl unter der Wurzel muss zwischen den Quadraten deiner beiden Zahlen liegen.",
  notConsecutive: "Gesucht sind zwei <b>aufeinanderfolgende</b> ganze Zahlen (z. B. 3 und 4). Quadriere deine Kandidaten und grenze enger ein.",
  soonTitle: "Verschlossene Tür",
  soonText: "An der Tür hängt ein Schild: „Kommt bald.“ Weitere Ermittlungsorte sind noch in Bau."
};

/* ---------- Rätsel ----------
   kind:
     num    – numerische Eingabe, tolerant (Komma/Punkt, Leerzeichen, * und √-Schreibweisen)
     set    – Lösungsmenge aus Zahlen (Reihenfolge egal)
     token  – Begriff (z. B. Niveaus n/z/q/r, rational/irrational)

/* ---------- Normierung der Eingaben (tolerant) ----------
   Rätselarten (kind):
     num     – eine Zahl (Komma/Punkt, Leerzeichen egal)
     set     – Menge aus Zahlen, Reihenfolge egal; ±11 wird zu −11 und 11
               (interval: true → "7-8", "7 < √50 < 8" werden verstanden)
     word    – Begriff per Schnellwahl-Button oder Eingabe (n/z/q/r, rational/irrational)
     term    – Wurzelterm (√21, 6√2, 5√3/3, 2a√2); "wurzel", "sqrt", *, ·, Klammern tolerant
     termset – Lösungsmenge aus Termen (L = {−√6; √6}, ±√6, x1 = …; x2 = …)
     choice  – Auswahlmöglichkeiten
   --------------------------------------------------------- */

function unifyMinus(s) {
  return String(s == null ? "" : s).replace(/[−–—]/g, "-");
}

/* Kanonische Schreibweise eines Wurzelterms (für den Vergleich) */
function canonTerm(raw) {
  var s = unifyMinus(raw).toLowerCase()
    .replace(/\s+/g, "")
    .replace(/wurzel|sqrt/g, "√")
    .replace(/[·*×⋅]/g, "")
    .replace(/:/g, "/")
    .replace(/,/g, ".")
    .replace(/\^2/g, "²");
  s = s.replace(/√\((\d+(?:\.\d+)?|[a-z])\)/g, "√$1");   // √(21) → √21
  s = s.replace(/^\(([^()]*)\)\//, "$1/");               // (5√3)/3 → 5√3/3
  s = s.replace(/^\+/, "");
  return s;
}

/* Kleiner, sicherer Rechner für Wurzelterme (kein eval).
   Unterstützt Zahlen, a, √, ², + − · /, Klammern, implizites Mal.
   Rückgabe NaN, wenn der Term nicht lesbar ist. */
function evalTerm(raw, aVal) {
  var s = canonTerm(raw);
  var i = 0;
  if (aVal === undefined) aVal = 1.7;
  function peek() { return s.charAt(i); }
  function primary() {
    var c = peek();
    if (c === "(") {
      i++;
      var v = expr();
      if (peek() !== ")") throw new Error("Klammer");
      i++;
      return v;
    }
    if (c === "√") {
      i++;
      var r = primary();
      if (r < 0) throw new Error("negativ");
      return Math.sqrt(r);
    }
    if (c === "a") { i++; return aVal; }
    var m = /^\d+(?:\.\d+)?/.exec(s.slice(i));
    if (!m) throw new Error("Zahl");
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function factor() {
    if (peek() === "-") { i++; return -factor(); }
    if (peek() === "+") { i++; return factor(); }
    var v = primary();
    while (peek() === "²") { i++; v = v * v; }
    return v;
  }
  function term() {
    var v = factor();
    for (;;) {
      var c = peek();
      if (c === "/") { i++; v = v / factor(); }
      else if (c && /[\d(√a]/.test(c)) { v = v * factor(); }
      else return v;
    }
  }
  function expr() {
    var v = term();
    for (;;) {
      var c = peek();
      if (c === "+") { i++; v += term(); }
      else if (c === "-") { i++; v -= term(); }
      else return v;
    }
  }
  try {
    if (!s) return NaN;
    var val = expr();
    if (i !== s.length || !isFinite(val)) return NaN;
    return val;
  } catch (e) {
    return NaN;
  }
}

function near(a, b) { return Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(b)); }

/* Lösungsmenge aus Termen zerlegen: "L = {−√6; √6}", "±√6", "x1 = √6, x2 = −√6" */
function parseTermSet(raw) {
  var s = unifyMinus(raw).toLowerCase().replace(/\s+/g, "")
    .replace(/\+\/-|\+-/g, "±")
    .replace(/^l=/, "")
    .replace(/[{}]/g, "");
  var out = [];
  s.split(/;|,|und|oder/).forEach(function (part) {
    part = part.replace(/^x(_?[12])?=/, "");
    if (!part) return;
    if (part.charAt(0) === "±") {
      var t = canonTerm(part.slice(1));
      out.push(t, canonTerm("-" + t));
    } else {
      out.push(canonTerm(part));
    }
  });
  return out;
}

function sameStrings(a, b) {
  if (a.length !== b.length) return false;
  var x = a.slice().sort(), y = b.slice().sort();
  return x.every(function (v, k) { return v === y[k]; });
}

/* Zahlen aus einer Eingabe holen; ±11 ergibt −11 und 11 */
function extractNumbers(raw, interval) {
  var s = unifyMinus(raw).replace(/\+\/-|\+-/g, "±");
  if (interval) {
    s = s.replace(/√\(?\d+(?:[.,]\d+)?\)?/g, " ");       // "7 < √50 < 8" → 7, 8
    s = s.replace(/(\d)\s*-\s*(?=\d)/g, "$1;");          // "7-8" → 7;8
  }
  var out = [];
  var re = /([±+-]?)\s*(\d+(?:[.,]\d+)?)/g;
  var m;
  while ((m = re.exec(s)) !== null) {
    var v = parseFloat(m[2].replace(",", "."));
    if (m[1] === "±") out.push(-v, v);
    else out.push(m[1] === "-" ? -v : v);
  }
  return out;
}

function numsEqual(a, b) {
  if (a.length !== b.length) return false;
  var x = a.slice().sort(function (p, q) { return p - q; });
  var y = b.slice().sort(function (p, q) { return p - q; });
  return x.every(function (v, i) { return Math.abs(v - y[i]) < 1e-9; });
}

/* Begriffe: liefert alle passenden Deutungen einer Eingabe */
function wordKeys(raw) {
  var s = String(raw == null ? "" : raw).toLowerCase().replace(/\s+/g, "").replace(/[.!"„“]/g, "");
  var keys = [s];
  var rules = [
    [/^(ℕ|n|natürlich(e|en)?(zahl(en)?)?)$/, "n"],
    [/^(ℤ|z|ganz(e|en)?(zahl(en)?)?)$/, "z"],
    [/^(ℚ|q|rational(e|en)?zahl(en)?)$/, "q"],
    [/^(ℝ|r|reell(e|en)?(zahl(en)?)?)$/, "r"],
    [/^(irrational(e|er|es)?(zahl(en)?)?|nicht-?rational)$/, "irrational"],
    [/^rational(e|er|es)?(zahl(en)?)?$/, "rational"]
  ];
  rules.forEach(function (r) { if (r[0].test(s)) keys.push(r[1]); });
  return keys;
}

/* ---------- Auswertung ---------- */

/* Prüft eine Eingabe gegen ein Rätsel. Rückgabe: { ok, errorText } */
function checkAnswer(puzzle, rawInput, choiceIndex) {
  var fn = CHECKERS[puzzle.kind];
  if (!fn) return { ok: false, errorText: DATA.errors.generic };
  return fn(puzzle, rawInput, choiceIndex);
}

function findError(puzzle, test) {
  var list = puzzle.commonErrors || [];
  for (var k = 0; k < list.length; k++) {
    if (test(list[k].when)) return list[k].text;
  }
  return null;
}

var CHECKERS = {
  choice: function (p, raw, idx) {
    var c = p.choices[idx];
    if (!c) return { ok: false, errorText: DATA.errors.generic };
    if (c.ok) return { ok: true };
    return { ok: false, errorText: c.feedback || DATA.errors.generic };
  },

  num: function (p, raw) {
    var nums = extractNumbers(raw);
    if (nums.length === 1 && p.solution.accept.some(function (a) { return near(nums[0], a); })) {
      return { ok: true };
    }
    var t = nums.length === 1 && findError(p, function (w) { return typeof w === "number" && near(nums[0], w); });
    return { ok: false, errorText: t || DATA.errors.generic };
  },

  set: function (p, raw) {
    var nums = extractNumbers(raw, p.interval);
    var sol = p.solution.set;
    if (numsEqual(nums, sol)) return { ok: true };
    var t = findError(p, function (w) {
      if (Array.isArray(w)) return numsEqual(nums, w);
      if (typeof w === "number") return nums.length === 1 && near(nums[0], w);
      return false;
    });
    if (!t && nums.length > 0 && nums.length < sol.length) {
      t = findError(p, function (w) { return w === "kind:incomplete-set"; });
    }
    if (!t && p.interval && nums.length === 2) {
      t = Math.abs(nums[0] - nums[1]) !== 1 ? DATA.errors.notConsecutive : DATA.errors.wrongBounds;
    }
    return { ok: false, errorText: t || DATA.errors.generic };
  },

  word: function (p, raw) {
    var keys = wordKeys(raw);
    var good = [p.solution.token].concat(p.solution.tokenAlt || []);
    if (keys.some(function (k) { return good.indexOf(k) >= 0; })) return { ok: true };
    var t = findError(p, function (w) { return keys.indexOf(String(w)) >= 0; });
    return { ok: false, errorText: t || DATA.errors.generic };
  },

  term: function (p, raw) {
    var c = canonTerm(raw);
    var good = [p.solution.token].concat(p.solution.tokenAlt || []).map(canonTerm);
    if (good.indexOf(c) >= 0) return { ok: true };
    var t = findError(p, function (w) { return canonTerm(String(w)) === c; });
    if (!t && termValueMatches(c, p.solution.token)) t = p.notSimplified || DATA.errors.notSimplified;
    return { ok: false, errorText: t || DATA.errors.generic };
  },

  termset: function (p, raw) {
    var got = parseTermSet(raw);
    var sol = p.solution.terms.map(canonTerm);
    if (sameStrings(got, sol)) return { ok: true };
    var t = findError(p, function (w) {
      return Array.isArray(w) && sameStrings(got, w.map(canonTerm));
    });
    if (!t && got.length > 0 && got.length < sol.length &&
        got.every(function (g) { return sol.some(function (x) { return termValueMatches(g, x); }); })) {
      t = findError(p, function (w) { return w === "kind:incomplete-set"; });
    }
    if (!t && got.length === sol.length) {
      var vg = got.map(function (g) { return evalTerm(g); }).sort(function (a, b) { return a - b; });
      var vs = sol.map(function (g) { return evalTerm(g); }).sort(function (a, b) { return a - b; });
      if (vg.every(function (v, k) { return isFinite(v) && near(v, vs[k]); })) {
        t = p.notSimplified || DATA.errors.notSimplified;
      }
    }
    return { ok: false, errorText: t || DATA.errors.generic };
  }
};

/* Gleicher Wert (an zwei Stellen für a geprüft) – Term aber anders geschrieben */
function termValueMatches(input, solution) {
  return [1.7, 2.3].every(function (a) {
    var x = evalTerm(input, a), y = evalTerm(solution, a);
    return isFinite(x) && isFinite(y) && near(x, y);
  });
}

/* ---------- DOM-Helfer ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>]/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch];
  });
}

function msg(html) { $("msgbar").innerHTML = html; }

/* variant: "" (Aktenblatt), "notebook" (liniertes Notizbuch), "report" (Abschlussbericht) */
function showModal(html, focusId, variant) {
  $("modal").className = "modal" + (variant ? " " + variant : "");
  $("modal").innerHTML = html;
  $("modal").scrollTop = 0;
  $("overlay").classList.remove("hidden");
  if (focusId) {
    var el = $(focusId);
    if (el) el.focus();
  }
}

function closeModal() {
  $("overlay").classList.add("hidden");
  $("modal").innerHTML = "";
}

$("overlay").addEventListener("click", function (ev) {
  if (ev.target === $("overlay")) closeModal();
});

/* ---------- Rendering ---------- */
function renderRoom() {
  var room = DATA.rooms[State.currentRoom];
  $("location-label").textContent = room.name;
  var svg = '<svg viewBox="0 0 960 540" role="img" aria-label="' + esc(room.name) + '">';
  svg += DATA.sceneDefs + room.backdrop;
  svg += '<rect width="960" height="540" fill="url(#g-vignette)" pointer-events="none"/>';
  room.hotspots.forEach(function (h) {
    var solvedMark = (h.type === "puzzle" && isSolved(h.puzzleId)) ||
                     (h.type === "niveau" && h.puzzleIds.every(isSolved)) ||
                     (h.type === "item" && State.inventory.indexOf(h.itemId) >= 0);
    /* Marker oben rechts im Hotspot, damit Beschriftungen lesbar bleiben.
       Symbol statt Farbe allein: ? Rätsel, ✓ gelöst, ★ Zusatzrätsel, + Gegenstand,
       i Hinweis, → Tür, ☎ Finale */
    var cx = h.x + h.w - 20;
    var cy2 = h.y + 20;
    var sym = { puzzle: "?", niveau: "★", item: "+", info: "i", door: "→", finale: "☎" }[h.type] || "?";
    if (solvedMark) sym = "✓";
    svg += '<g class="hotspot' + (solvedMark ? " solved" : "") +
           '" data-hotspot="' + h.id + '" tabindex="0" role="button" aria-label="' + esc(h.label) + '">';
    svg += '<rect class="hit" x="' + h.x + '" y="' + h.y + '" width="' + h.w + '" height="' + h.h + '"/>';
    svg += '<circle class="marker" cx="' + cx + '" cy="' + cy2 + '" r="16"/>';
    svg += '<text class="marker-text" x="' + cx + '" y="' + (cy2 + 7) + '">' + sym + "</text>";
    svg += "</g>";
  });
  svg += "</svg>";
  $("stage").innerHTML = svg;
  Array.prototype.forEach.call(document.querySelectorAll("[data-hotspot]"), function (g) {
    function activate() { activateHotspot(g.getAttribute("data-hotspot")); }
    g.addEventListener("click", activate);
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
    });
  });
}

function activateHotspot(id) {
  var room = DATA.rooms[State.currentRoom];
  var h = room.hotspots.filter(function (x) { return x.id === id; })[0];
  if (!h) return;
  if (h.type === "puzzle") {
    var p = DATA.puzzles[h.puzzleId];
    if (isSolved(p.id)) {
      msg("<b>" + esc(p.title) + "</b> – bereits gelöst. Gut gemacht!");
      return;
    }
    openPuzzle(p.id);
  } else if (h.type === "niveau") {
    openNiveau(h.puzzleIds, h.label);
  } else if (h.type === "item") {
    takeItem(h);
  } else if (h.type === "info") {
    if (h.requiresItem && State.inventory.indexOf(h.requiresItem) < 0) {
      msg("Hier ist es zu dunkel. Vielleicht hilft eine <b>Taschenlampe</b> aus der Kiste.");
      return;
    }
    msg(escWithoutTags(h.text));
    if (h.note && State.notes.indexOf(h.note) < 0) {
      State.notes.push(h.note);
      msg("<b>Notizbuch ergänzt!</b> " + h.text);
      saveState();
    }
  } else if (h.type === "door") {
    tryDoor(h);
  } else if (h.type === "finale") {
    tryFinale();
  }
}

function escWithoutTags(s) {
  // Story-Texte enthalten bewusst <b>-Tag(s)
  return String(s);
}

function takeItem(h) {
  if (State.inventory.indexOf(h.itemId) >= 0) {
    msg("Die Kiste ist leer. Nur Staub – und der ist quadratisch.");
    return;
  }
  var item = DATA.items[h.itemId];
  State.inventory.push(h.itemId);
  saveState();
  msg("<b>Aufgenommen:</b> " + esc(item.name) + ". " + esc(item.desc));
  renderRoom();
}

function tryDoor(h) {
  if (h.requiredPuzzle && !isSolved(h.requiredPuzzle)) {
    msg(escWithoutTags(h.lockedText));
    return;
  }
  State.currentRoom = h.doorId;
  saveState();
  renderRoom();
  msg(escWithoutTags(DATA.rooms[h.doorId].msgStart));
  window.scrollTo(0, 0);
}

function tryFinale() {
  if (!requiredDone()) {
    var missing = DATA.story.requiredIds.filter(function (id) { return !isSolved(id); })
      .map(function (id) { return DATA.puzzles[id].title; });
    msg("Der Direktor hält den Hörer fest: „Erst alle Pflicht-Indizien sichern, dann wird telefoniert!“ Noch offen: <b>" + esc(missing.join(" · ")) + "</b>");
    return;
  }
  var li = DATA.endCompetences.map(function (c) {
    var done = isSolved(c.required);
    return '<li class="' + (done ? "done" : "") + '"><span class="n-title">' + c.title + "</span>" +
           (done ? "" : ' <span class="n-text">– noch offen (Zusatzrätsel)</span>') + "</li>";
  }).join("");
  showModal(
    '<div class="kicker">Abschlussbericht · Akte Nr. √2</div>' +
    "<h2>Fall gelöst!</h2>" +
    '<div class="stamp stamp-ok stamp-anim">Fall gelöst</div>' +
    '<svg class="end-figure" viewBox="0 0 200 180" aria-hidden="true">' + sqrt2Figure("happy") + "</svg>" +
    "<p class=\"desc\">√2 meldet sich am Direktions-Telefon: „Danke, dass du endlich anerkennst, dass ich rational nicht zu fassen bin. Ich war übrigens nie wirklich weg – nur unerhörlich. Ich hänge mich gleich wieder selbst in den Rahmen. – √2“. Der Direktor setzt sich und atmet aus. √2 ist zurück, der Fall geschlossen.</p>" +
    "<h3>Gesicherte Kompetenzen</h3><ul class=\"plain\" id=\"end-list\">" + li + "</ul>" +
    "<p class=\"desc\">Zusätzlich gelöste Zusatzrätsel: " +
    Object.keys(State.solved).filter(function (id) { return DATA.story.requiredIds.indexOf(id) < 0; }).length + "</p>" +
    "<div class=\"actions\"><button class=\"btn\" id=\"btn-close-end\" type=\"button\">Weiterspielen</button></div>",
    null, "report"
  );
  State.done = true;
  saveState();
  $("btn-close-end").addEventListener("click", closeModal);
}

/* ---------- Die Figur √2 (eigene Zeichnung) ----------
   mood: "worried" (Startscreen, Steckbrief) | "happy" (Abschluss) */
function sqrt2Figure(mood) {
  var happy = mood === "happy";
  var pupilDy = happy ? -2 : 3;
  var svg = "";
  if (happy) svg += '<g fill="#ffd046"><path d="M30 30 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M180 100 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/></g>';
  /* Augen, die über den Wurzelstrich schauen */
  [128, 154].forEach(function (x) {
    svg += '<circle cx="' + x + '" cy="30" r="11" fill="#fff" stroke="#2b2419" stroke-width="3"/>';
    svg += '<circle cx="' + (x + 1) + '" cy="' + (30 + pupilDy) + '" r="4.5" fill="#2b2419"/>';
  });
  svg += happy
    ? '<path d="M118 14 q10 -8 20 -2 M146 12 q10 -6 20 2" stroke="#2b2419" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : '<path d="M118 12 q10 4 20 2 M146 14 q10 -2 20 -6" stroke="#2b2419" stroke-width="3" fill="none" stroke-linecap="round"/>';
  /* Wurzelzeichen */
  svg += '<path d="M14 112 L36 100 L62 158 L102 42 L190 42" fill="none" stroke="#2b2419" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>';
  /* die 2 */
  svg += '<path d="M118 82 C118 58 172 56 172 82 C172 102 144 118 118 152 L176 152" fill="none" stroke="#a8322a" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>';
  return svg;
}

/* ---------- Rätsel-Dialog ---------- */
function openNiveau(puzzleIds, label) {
  var labels = { leicht: "Leicht", standard: "Standard", plus: "Plus" };
  var buttons = puzzleIds.map(function (id) {
    var p = DATA.puzzles[id];
    var state = isSolved(id) ? " ✓" : "";
    return '<button class="btn btn-secondary" data-niveau="' + id + '" type="button">' + esc(labels[p.niv]) + state + "</button>";
  }).join("");
  showModal(
    '<div class="kicker">Zusatzrätsel</div>' +
    "<h2>" + esc(label) + "</h2>" +
    "<p class=\"desc\">Drei Niveaus – freie Auswahl. Zusatzrätsel sind optional.</p>" +
    "<div class=\"niveau-bar\">" + buttons + "</div>" +
    "<div class=\"actions\"><button class=\"btn btn-secondary btn-small\" id=\"btn-abort-niveau\" type=\"button\">Schließen</button></div>"
  );
  $("btn-abort-niveau").addEventListener("click", closeModal);
  Array.prototype.forEach.call(document.querySelectorAll("[data-niveau]"), function (b) {
    b.addEventListener("click", function () { openPuzzle(b.getAttribute("data-niveau")); });
  });
}

function openPuzzle(id) {
  var p = DATA.puzzles[id];
  var iHtml = '<div class="kicker">Indiz · ' + esc(DATA.rooms[p.room].name.replace(/^Raum \d: /, "")) + "</div>";
  iHtml += "<h2>" + esc(p.title) + "<span class=\"tag\">" +
              ({ main: "Pflicht", leicht: "Leicht", standard: "Standard", plus: "Plus" })[p.niv] + "</span></h2>";
  iHtml += "<p class=\"desc\">" + p.desc + "</p>";
  iHtml += "<p class=\"prompt\"><b>Aufgabe:</b> " + p.prompt + "</p>";
  var usesInput = p.kind !== "choice" && !p.quick;
  if (p.kind === "choice") {
    iHtml += '<div class="choices">' + p.choices.map(function (c, i) {
      return '<button class="choice" data-choice="' + i + '" type="button">' + c.text + "</button>";
    }).join("") + "</div>";
  } else if (p.quick) {
    iHtml += '<div class="quick">' + p.quick.map(function (q) {
      return '<button class="btn btn-secondary" data-quick="' + esc(q[0]) + '" type="button">' + esc(q[1]) + "</button>";
    }).join("") + "</div>";
  } else {
    iHtml += '<input class="answer-input" id="answer" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Deine Antwort …">';
    var syms = SYMBOLS[p.kind] || [];
    if (syms.length) {
      iHtml += '<div class="symbar" aria-label="Sonderzeichen einfügen">' + syms.map(function (sy) {
        return '<button class="sym" data-sym="' + esc(sy[0]) + '" type="button" aria-label="' + esc(sy[2] || sy[1]) + '">' + esc(sy[1]) + "</button>";
      }).join("") + '<button class="sym sym-del" data-sym="DEL" type="button" aria-label="Zeichen löschen">⌫</button></div>';
    }
  }
  iHtml += '<div id="feedback" class="info"></div><div id="help-area"></div>';
  iHtml += '<div class="actions">';
  if (usesInput) iHtml += '<button class="btn" id="btn-check" type="button">Prüfen</button>';
  iHtml += '<button class="btn btn-secondary btn-small" id="btn-help" type="button">Hilfe: Tipp</button>';
  iHtml += '<button class="btn btn-secondary btn-small" id="btn-quit" type="button">Später</button>';
  iHtml += "</div>";
  showModal(iHtml, usesInput ? "answer" : null);

  var fails = State.fails[id] || 0;
  var lvl = State.helpLevel[id] || 0;

  function feedback(cls, text) {
    var f = $("feedback");
    f.className = cls;
    f.innerHTML = text;
  }

  /* Hilfestufen bleiben stehen und bauen aufeinander auf */
  function showHelpLevel(n) {
    var html = "";
    if (n >= 1) html += '<div class="helpbox"><span class="helplabel">1 · Tipp</span>' + p.help.hint + "</div>";
    if (n >= 2) html += '<div class="helpbox merk"><span class="helplabel">2 · Merkkasten</span>' + p.help.merk + "</div>";
    if (n >= 3) html += '<div class="helpbox beispiel"><span class="helplabel">3 · Beispiel</span>' + p.help.beispiel + "</div>";
    $("help-area").innerHTML = html;
    var btn = $("btn-help");
    btn.textContent = ["Hilfe: Tipp", "Hilfe: Merkkasten", "Hilfe: Beispiel", "Alle Hilfen offen"][Math.min(n, 3)];
    btn.disabled = n >= 3;
  }

  function offerReveal() {
    if (document.getElementById("btn-reveal")) return;
    var a = $("modal").querySelector(".actions");
    var b = document.createElement("button");
    b.className = "btn-secondary btn btn-small";
    b.id = "btn-reveal";
    b.type = "button";
    b.textContent = "Lösung zeigen (nach 5 Versuchen)";
    b.addEventListener("click", function () {
      feedback("info", "Lösung: " + p.reveal);
      document.getElementById("btn-reveal").disabled = true;
      var okBtn = document.getElementById("btn-reveal-ok");
      if (!okBtn) {
        var ok = document.createElement("button");
        ok.className = "btn btn-small";
        ok.id = "btn-reveal-ok";
        ok.type = "button";
        ok.textContent = "Weiter mit der Lösung";
        ok.addEventListener("click", function () { solvePuzzle(p, true); });
        a.appendChild(ok);
      }
    });
    a.appendChild(b);
  }

  function handleCheck() {
    var raw = $("answer").value;
    if (!raw.trim()) { feedback("err", "Bitte gib etwas ein."); return; }
    var res = checkAnswer(p, raw);
    if (res.ok) { solvePuzzle(p, false); return; }
    fails += 1;
    State.fails[id] = fails;
    saveState();
    feedback("err", res.errorText);
    if (fails >= 5) offerReveal();
  }

  function handleChoice(i, raw) {
    var res = checkAnswer(p, raw === undefined ? null : raw, i);
    if (res.ok) { solvePuzzle(p, false); return; }
    fails += 1;
    State.fails[id] = fails;
    saveState();
    feedback("err", res.errorText);
    if (fails >= 5) offerReveal();
  }

  if (p.kind === "choice") {
    Array.prototype.forEach.call(document.querySelectorAll("[data-choice]"), function (b) {
      b.addEventListener("click", function () { handleChoice(parseInt(b.getAttribute("data-choice"), 10)); });
    });
  } else if (p.quick) {
    Array.prototype.forEach.call(document.querySelectorAll("[data-quick]"), function (b) {
      b.addEventListener("click", function () { handleChoice(null, b.getAttribute("data-quick")); });
    });
  } else {
    $("btn-check").addEventListener("click", handleCheck);
    $("answer").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") handleCheck();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sym]"), function (b) {
      /* Fokus im Eingabefeld behalten, damit die iPad-Tastatur offen bleibt */
      b.addEventListener("pointerdown", function (ev) { ev.preventDefault(); });
      b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      b.addEventListener("click", function () { insertSymbol($("answer"), b.getAttribute("data-sym")); });
    });
  }

  $("btn-help").addEventListener("click", function () {
    lvl = Math.min(lvl + 1, 3);
    State.helpLevel[id] = lvl;
    saveState();
    showHelpLevel(lvl);
    feedback("info", lvl < 3 ? "Noch nicht weiter? Es gibt eine weitere Hilfestufe." : "Das war die letzte Hilfestufe – vergleiche das Beispiel mit deiner Aufgabe. Du schaffst das!");
  });
  if (lvl > 0) showHelpLevel(lvl);
  if (fails >= 5) offerReveal();

  $("btn-quit").addEventListener("click", closeModal);
}

/* Sonderzeichen je Rätselart: [eingefügter Text, Beschriftung, Vorlesetext] */
var SYMBOLS = {
  num: [["-", "−", "Minus"], [",", ",", "Komma"]],
  set: [["-", "−", "Minus"], ["; ", ";", "Strichpunkt"], ["±", "±", "plus minus"]],
  term: [["√", "√", "Wurzel"], ["²", "²", "hoch 2"], ["/", "/", "Bruchstrich"], ["(", "(", "Klammer auf"], [")", ")", "Klammer zu"]],
  termset: [["√", "√", "Wurzel"], ["±", "±", "plus minus"], ["-", "−", "Minus"], ["; ", ";", "Strichpunkt"], ["{", "{", "Mengenklammer auf"], ["}", "}", "Mengenklammer zu"]]
};

function insertSymbol(inp, text) {
  var v = inp.value;
  var st = typeof inp.selectionStart === "number" ? inp.selectionStart : v.length;
  var en = typeof inp.selectionEnd === "number" ? inp.selectionEnd : st;
  if (text === "DEL") {
    if (st === en && st > 0) st -= 1;
    inp.value = v.slice(0, st) + v.slice(en);
    en = st;
  } else {
    inp.value = v.slice(0, st) + text + v.slice(en);
    st = en = st + text.length;
  }
  try { inp.setSelectionRange(st, en); } catch (e) { /* ignorieren */ }
  inp.focus();
}

function solvePuzzle(p, viaReveal) {
  if (!isSolved(p.id)) {
    State.solved[p.id] = true;
    var o = p.onSolve || {};
    if (o.note && State.notes.indexOf(o.note) < 0) State.notes.push(o.note);
    if (o.found && State.found.indexOf(o.found) < 0) State.found.push(o.found);
  }
  saveState();
  var f = $("feedback");
  f.className = "ok";
  f.innerHTML = (viaReveal ? "Notiert! " : "") +
    "<b>Richtig!</b> Beweis gesichert: " + p.reveal;
  if (!$("modal").querySelector(".stamp")) {
    var st = document.createElement("div");
    st.className = "stamp stamp-ok stamp-anim";
    st.textContent = viaReveal ? "Notiert" : "Gelöst";
    $("modal").appendChild(st);
  }
  var q = $("modal").querySelector(".actions");
  q.innerHTML = '<button class="btn" id="btn-after-solve" type="button">Weiter</button>';
  $("btn-after-solve").addEventListener("click", function () {
    closeModal();
    renderRoom();
    msg("<b>Indiz gesichert:</b> " + esc(p.title));
  });
}

/* ---------- Notizbuch, Inventar, Karte ---------- */
function openNotes() {
  var merkHTML = State.notes.length
    ? "<ul class=\"plain\">" + State.notes.map(function (nid) {
        var n = DATA.notes[nid];
        if (!n) return "";
        return '<li><span class="n-title">' + esc(n.title) + '</span><br><span class="n-text">' + n.text + "</span></li>";
      }).join("") + "</ul>"
    : "<p class=\"desc\">Noch keine Merkregeln gefunden. Löse Indizien – deine Merkregeln landen dann hier.</p>";
  var foundHTML = State.found.length
    ? "<ul class=\"plain\">" + State.found.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>"
    : "<p class=\"desc\">Noch keine Zahlen gesichert.</p>";
  showModal(
    "<h2>Notizbuch</h2><h3>Merkregeln</h3>" + merkHTML +
    "<h3>Gesicherte Zahlen</h3>" + foundHTML +
    "<div class=\"actions\"><button class=\"btn btn-secondary btn-small\" id=\"btn-close-notes\" type=\"button\">Schließen</button></div>",
    null, "notebook"
  );
  $("btn-close-notes").addEventListener("click", closeModal);
}

function openInventory() {
  var html = State.inventory.length
    ? "<ul class=\"plain\">" + State.inventory.map(function (iid) {
        var it = DATA.items[iid];
        return '<li><span class="n-title">' + esc(it.name) + "</span><br><span class=\"n-text\">" + esc(it.desc) + "</span></li>";
      }).join("") + "</ul>"
    : "<p class=\"desc\">Deine Taschen sind noch leer.</p>";
  showModal("<h2>Inventar</h2>" + html +
    "<div class=\"actions\"><button class=\"btn btn-secondary btn-small\" id=\"btn-close-inv\" type=\"button\">Schließen</button></div>");
  $("btn-close-inv").addEventListener("click", closeModal);
}

function roomUnlocked(rid) {
  var req = DATA.story.roomUnlock ? DATA.story.roomUnlock[rid] : null;
  return !req || isSolved(req);
}

function openMap() {
  var html = "";
  DATA.story.roomOrder.forEach(function (rid) {
    var room = DATA.rooms[rid];
    var label = room.name + (State.currentRoom === rid ? " – du bist hier" : "");
    html += '<li><span class="n-title">' + esc(label) + "</span>";
    if (State.currentRoom !== rid) {
      if (roomUnlocked(rid)) {
        html += ' <button class="btn btn-secondary btn-small" data-goto="' + rid + '" type="button">Hingehen</button>';
      } else {
        html += ' <span class="n-text">(noch verschlossen)</span>';
      }
    }
    html += "</li>";
  });
  showModal(
    "<h2>Räume</h2><ul class=\"plain\">" + html + "</ul>" +
    "<div class=\"actions\"><button class=\"btn btn-secondary btn-small\" id=\"btn-close-map\" type=\"button\">Schließen</button></div>"
  );
  $("btn-close-map").addEventListener("click", closeModal);
  Array.prototype.forEach.call(document.querySelectorAll("[data-goto]"), function (b) {
    b.addEventListener("click", function () {
      var rid = b.getAttribute("data-goto");
      if (!roomUnlocked(rid)) {
        msg("Dieser Raum ist noch verschlossen. Löse erst die Pflicht-Indizien im vorherigen Raum.");
        return;
      }
      State.currentRoom = rid;
      saveState();
      closeModal();
      renderRoom();
      msg(escWithoutTags(DATA.rooms[rid].msgStart));
      window.scrollTo(0, 0);
    });
  });
}

/* ---------- Start / Restart ---------- */
function startGame(fresh) {
  if (fresh) clearState();
  $("screen-start").classList.add("hidden");
  $("screen-game").classList.remove("hidden");
  renderRoom();
  msg(escWithoutTags(DATA.rooms[State.currentRoom].msgStart));
  saveState();
}

$("btn-start").addEventListener("click", function () { startGame(true); });
$("btn-continue").addEventListener("click", function () { startGame(false); });
$("btn-notes").addEventListener("click", openNotes);
$("btn-inventory").addEventListener("click", openInventory);
$("btn-map").addEventListener("click", openMap);
$("btn-restart").addEventListener("click", function () {
  showModal(
    "<h2>Neu starten?</h2><p class=\"desc\">Der bisherige Spielstand wird gelöscht.</p>" +
    "<div class=\"actions\"><button class=\"btn\" id=\"btn-restart-yes\" type=\"button\">Ja, neu starten</button>" +
    "<button class=\"btn btn-secondary\" id=\"btn-restart-no\" type=\"button\">Abbrechen</button></div>"
  );
  $("btn-restart-yes").addEventListener("click", function () {
    closeModal();
    clearState();
    $("screen-game").classList.add("hidden");
    $("screen-start").classList.remove("hidden");
    $("btn-continue").classList.add("hidden");
    setState(undefined);
  });
  $("btn-restart-no").addEventListener("click", closeModal);
});

function setState(msg) {
  document.getElementById("intro-text").innerHTML = DATA.story.intro;
  document.getElementById("poster-sqrt2").innerHTML = sqrt2Figure("worried");
  var hint = document.getElementById("continue-hint");
  hint.classList.add("hidden");
  if (msg) {
    hint.textContent = msg;
    hint.classList.remove("hidden");
  }
}

/* ---------------------------------------------------------
   3. DEV-TESTS (nur mit ?dev=1 aktiv, nicht im normalen Spiel sichtbar)
   Prüft: Rechung jeder Aufgabe, tolerant akzeptierte Eingaben,
   Hilfsstufen, typische Fehler (jede Meldung mindestens einmal auslösbar),
   Soft-Lock-Freiheit, Pflichtpfad.
   --------------------------------------------------------- */
/* Rechnet die Musterlösung eines Rätsels unabhängig nach. Rückgabe: Fehlertext oder "" */
function devRecalc(p) {
  var c = p.calc;
  if (c.expr) {
    var v = evalTerm(c.expr);
    if (!isFinite(v)) return "Term " + c.expr + " nicht berechenbar";
    if (typeof c.round === "number") { var f = Math.pow(10, c.round); v = Math.round(v * f) / f; }
    if (p.kind === "num") return near(v, p.solution.accept[0]) ? "" : c.expr + " = " + v + ", Lösung " + p.solution.accept[0];
    if (p.kind === "term") return termValueMatches(p.solution.token, c.expr) ? "" : c.expr + " ≠ " + p.solution.token;
    if (p.kind === "word" && c.rational) {
      var isInt = Math.abs(v - Math.round(v)) < 1e-9;
      return (isInt ? "rational" : "irrational") === p.solution.token ? "" : "Einordnung passt nicht";
    }
    return "";
  }
  if (c.root) {
    var lo = Math.min.apply(null, p.solution.set), hi = Math.max.apply(null, p.solution.set);
    return (hi - lo === 1 && lo * lo < c.root && c.root < hi * hi) ? "" : "√" + c.root + " liegt nicht zwischen " + lo + " und " + hi;
  }
  if (c.square) {
    var vals = p.kind === "set" ? p.solution.set : p.solution.terms.map(function (t) { return evalTerm(t); });
    var okSq = vals.length === 2 && vals.every(function (x) { return near(x * x, c.square); }) && near(vals[0], -vals[1]);
    return okSq ? "" : "Lösungen erfüllen x² = " + c.square + " nicht";
  }
  return "";
}

window.__runDevTests = function () {
  var panel = document.getElementById("dev-panel");
  panel.classList.remove("hidden");
  var lines = [];
  var failCount = 0;
  function line(cls, txt) {
    lines.push('<span class="' + cls + '">' + txt + "</span>");
  }

  /* Pro Rätsel: Hilfen vorhanden, jede Lösungsvariante akzeptiert,
     jeder typische Fehler auslösbar, Reveal vorhanden */
  Object.keys(DATA.puzzles).forEach(function (id) {
    var p = DATA.puzzles[id];
    var ok = true;

    if (!p.help || !p.help.hint || !p.help.merk || !p.help.beispiel) {
      line("t-err", "FAIL " + id + ": Hilfestufen unvollständig"); failCount++; ok = false;
    }
    if (!p.reveal) {
      line("t-err", "FAIL " + id + ": reveal fehlt"); failCount++; ok = false;
    }
    if (!/^KE [123]$/.test(p.ke || "") || !p.op) {
      line("t-err", "FAIL " + id + ": Kompetenz (ke) oder Operator (op) fehlt"); failCount++; ok = false;
    }
    if (p.kind !== "choice" && p.kind !== "word" && !p.calc && id !== "labor_naehe") {
      line("t-err", "FAIL " + id + ": keine Nachrechnung (calc)"); failCount++; ok = false;
    }
    if (p.calc) {
      var calcErr = devRecalc(p);
      if (calcErr) { line("t-err", "FAIL " + id + ": Nachrechnung – " + calcErr); failCount++; ok = false; }
    }

    /* Lösungs-Eingaben tolerant prüfen */
    var goodInputs = [];
    if (p.kind === "num") {
      p.solution.accept.forEach(function (a) {
        goodInputs.push(String(a), String(a).replace(".", ","), " " + String(a) + " ");
      });
    } else if (p.kind === "set") {
      var asStrings = p.solution.set.map(String);
      goodInputs.push(
        "{" + asStrings.join("; ") + "}",
        asStrings.join(" und "),
        asStrings.slice().reverse().join(";"),
        "L={" + asStrings.join(";") + "}"
      );
      if (p.interval) goodInputs.push(asStrings.join("-"), asStrings.join(" – "));
      if (p.solution.set.length === 2 && p.solution.set[0] === -p.solution.set[1]) {
        goodInputs.push("±" + Math.abs(p.solution.set[0]), "+-" + Math.abs(p.solution.set[0]));
      }
    } else if (p.kind === "word") {
      goodInputs.push(p.solution.token);
      (p.quick || []).forEach(function (q) {
        if (q[0] === p.solution.token) goodInputs.push(q[1]);
      });
      if (p.solution.token === "rational") goodInputs.push("Rational", " rationale Zahl ");
      if (p.solution.token === "irrational") goodInputs.push("Irrational", "nicht rational");
      if (p.solution.token === "n") goodInputs.push("natürliche Zahlen");
      if (p.solution.token === "z") goodInputs.push("ganze Zahlen");
      if (p.solution.token === "r") goodInputs.push("reelle Zahlen");
    } else if (p.kind === "term") {
      var tk = p.solution.token;
      goodInputs.push(tk, " " + tk.replace(/√/g, "wurzel ") + " ", tk.replace(/√/g, "sqrt"),
                      tk.replace(/(\d)√/g, "$1*√"), tk.replace(/(\d)√/g, "$1 · √"),
                      tk.replace(/√(\d+)/g, "√($1)"));
    } else if (p.kind === "termset") {
      var ts = p.solution.terms;
      goodInputs.push("L = {" + ts.join("; ") + "}", ts.slice().reverse().join(";"),
                      "x1 = " + ts[0] + ", x2 = " + ts[1], ts.join(" und "));
      var pos = ts.filter(function (t) { return t.charAt(0) !== "-"; })[0];
      if (pos) goodInputs.push("±" + pos, "x = ±" + pos, "+-" + pos.replace(/√/g, "wurzel"));
    } else if (p.kind === "choice") {
      goodInputs = null;
      p.choices.forEach(function (c, i) {
        var res = checkAnswer(p, null, i);
        if (!!c.ok !== res.ok) {
          line("t-err", "FAIL " + id + ": Auswahl " + i + " falsch bewertet"); failCount++;
        } else if (!c.ok && !c.feedback) {
          line("t-err", "FAIL " + id + ": Auswahl " + i + " ohne Fehlerfeedback"); failCount++;
        }
      });
      var okCount = p.choices.filter(function (c) { return c.ok; }).length;
      if (okCount !== 1) {
        line("t-err", "FAIL " + id + ": " + okCount + " richtige Auswahlmöglichkeiten"); failCount++;
      }
    }
    if (goodInputs) {
      goodInputs.forEach(function (gi) {
        var res = checkAnswer(p, gi);
        if (!res.ok) {
          line("t-err", "FAIL " + id + ": Lösung \"" + gi + "\" nicht akzeptiert (" + res.errorText + ")"); failCount++; ok = false;
        }
      });
    }

    /* Typische Fehler auslösbar? */
    (p.commonErrors || []).forEach(function (e) {
      var triggered;
      if (e.when === "kind:incomplete-set") {
        triggered = p.kind === "set" ? String(p.solution.set[0])
                  : p.kind === "termset" ? p.solution.terms[1] : null;
      } else if (Array.isArray(e.when)) {
        triggered = e.when.join("; ");
      } else if (typeof e.when === "number") {
        triggered = String(e.when).replace(".", ",");
      } else {
        triggered = e.when;
      }
      if (triggered !== null) {
        var res = checkAnswer(p, triggered);
        if (res.ok || res.errorText !== e.text) {
          line("t-err", "FAIL " + id + ": Fehler \"" + triggered + "\" löst Feedback nicht aus"); failCount++; ok = false;
        }
      }
    });

    if (ok) line("t-ok", "OK " + id);
  });

  /* Engine-Meldungen (Wert stimmt / Grenzen / Nicht aufeinanderfolgend) auslösbar */
  [["lehrer_radizieren", "√72", DATA.errors.notSimplified],
   ["labor_eingrenzen", "6; 7", DATA.errors.wrongBounds],
   ["labor_eingrenzen", "6; 9", DATA.errors.notConsecutive],
   ["labor_eingrenzen", "7 < √50 < 8", null]].forEach(function (c) {
    var res = checkAnswer(DATA.puzzles[c[0]], c[1]);
    var good = c[2] === null ? res.ok : (!res.ok && res.errorText === c[2]);
    if (good) line("t-ok", "OK Engine-Meldung " + c[0] + " \"" + c[1] + "\"");
    else { line("t-err", "FAIL Engine-Meldung " + c[0] + " \"" + c[1] + "\""); failCount++; }
  });

  /* Soft-Lock-Check: Pflichtpfad nur von Raumsel-Rätseln abhängig,
     kein Gegenstand notwendig, jede Tür ohne dauerhafte Blockade */
  var itemReq = [];
  Object.keys(DATA.rooms).forEach(function (rid) {
    var room = DATA.rooms[rid];
    if (!room.backdrop || !Array.isArray(room.hotspots) || room.hotspots.length < 4) {
      line("t-err", "FAIL Raum " + rid + ": weniger als 4 Hotspots oder kein Szenenbild"); failCount++;
    }
    room.hotspots.forEach(function (h) {
      if (h.type === "door") {
        if (!h.doorId || !DATA.rooms[h.doorId]) {
          line("t-err", "FAIL Raum " + rid + ": Tür ohne gültiges Ziel"); failCount++;
        }
      }
      if (h.type === "puzzle" && !DATA.puzzles[h.puzzleId]) {
        line("t-err", "FAIL Raum " + rid + ": unbekanntes Rätsel " + h.puzzleId); failCount++;
      }
      if (h.type === "niveau") {
        var arr = h.puzzleIds || [];
        arr.forEach(function (pid) {
          if (!DATA.puzzles[pid]) {
            line("t-err", "FAIL Raum " + rid + ": unbekanntes Zusatzrätsel " + pid); failCount++;
          }
        });
        if (arr.length !== 3) {
          line("t-err", "FAIL Raum " + rid + ": Niveau-Auswahl braucht 3 Stufen"); failCount++;
        }
      }
      if (h.type === "item") itemReq.push(h.itemId);
    });
  });
  DATA.story.requiredIds.forEach(function (id) {
    if (!DATA.puzzles[id]) {
      line("t-err", "FAIL Pflichtpunkt " + id + " existiert nicht"); failCount++;
    }
  });
  /* Simulierter Lösungsweg: nur Pflichtpunkte + Tür – ohne Gegenstände, ohne Zusatz */
  var simOk = DATA.story.requiredIds.every(function (id) {
    var p = DATA.puzzles[id];
    if (!p) return false;
    var probe;
    if (p.kind === "choice") probe = checkAnswer(p, null, p.solution.index);
    else if (p.kind === "num") probe = checkAnswer(p, String(p.solution.accept[0]));
    else if (p.kind === "set") probe = checkAnswer(p, p.solution.set.join(";"));
    else if (p.kind === "termset") probe = checkAnswer(p, p.solution.terms.join(";"));
    else probe = checkAnswer(p, p.solution.token);
    return probe.ok;
  });
  if (!simOk) {
    line("t-err", "FAIL: Pflicht-Rätsel sind mit ihren Lösungen nicht lösbar (Soft-Lock-Risiko)"); failCount++;
  } else {
    line("t-ok", "OK Pflichtpfad ohne Gegenstände lösbar (kein Soft-Lock)");
  }
  /* Tür zur Bibliothek braucht genau keller_schloss */
  var tuer = DATA.rooms.keller.hotspots.filter(function (h) { return h.doorId === "bibliothek"; })[0];
  if (!tuer || tuer.requiredPuzzle !== "keller_schloss") {
    line("t-err", "FAIL: Tür zur Bibliothek sollte von keller_schloss abhängen"); failCount++;
  } else {
    line("t-ok", "OK Türlogik: Bibliothek erst nach Tresor-Code");
  }

  /* Spielstand: Speichern und Laden ohne Datenverlust */
  (function () {
    var backup = State, raw = null, storageOk = true;
    try { raw = localStorage.getItem("tatort-sqrt2"); } catch (e) { storageOk = false; }
    if (!storageOk) { line("t-ok", "OK localStorage gesperrt – Spiel läuft ohne Speicher"); return; }
    State = { currentRoom: "labor", solved: { keller_schloss: true }, inventory: ["taschenlampe"],
              notes: ["n_wurzel_def"], found: ["x"], fails: { labor_x2: 2 }, helpLevel: { labor_x2: 1 }, done: false };
    saveState();
    State = null;
    var loaded = loadState();
    var good = loaded && State.currentRoom === "labor" && State.solved.keller_schloss === true &&
               State.fails.labor_x2 === 2 && State.helpLevel.labor_x2 === 1 && State.inventory[0] === "taschenlampe";
    if (good) line("t-ok", "OK Spielstand bleibt nach Speichern/Laden erhalten");
    else { line("t-err", "FAIL Spielstand geht beim Laden verloren"); failCount++; }
    State = backup;
    try {
      if (raw === null) localStorage.removeItem("tatort-sqrt2");
      else localStorage.setItem("tatort-sqrt2", raw);
    } catch (e) { /* ignorieren */ }
  })();

  /* Notizen prüfen */
  Object.keys(DATA.puzzles).forEach(function (id) {
    var p = DATA.puzzles[id];
    if (p.onSolve && p.onSolve.note && !DATA.notes[p.onSolve.note]) {
      line("t-err", "FAIL " + id + ": Notiz " + p.onSolve.note + " fehlt"); failCount++;
    }
  });

  line("t-ok", failCount === 0 ? "ALLE TESTS BESTANDEN" : (failCount + " PROBLEM(E)"));
  panel.innerHTML = lines.join("\n");
  if (typeof console !== "undefined") {
    console.log("[DEV] Tatort-Zahlengerade-Tests:");
    lines.forEach(function (l) { console.log(l.replace(/<[^>]*>/g, "")); });
  }
};

/* Spielstand laden, falls vorhanden */
(function init() {
  if (loadState()) {
    setState("Spielstand gefunden. „Weiterspielen“ setzt die Ermittlung fort, „Neu starten“ löscht ihn.");
    document.getElementById("btn-continue").classList.remove("hidden");
  } else {
    setState();
  }
  /* DEV-MODUS */
  if (/[?&]dev=1/.test(window.location.search)) {
    window.__runDevTests();
  }
})();

</script>
